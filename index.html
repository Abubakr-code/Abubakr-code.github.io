      // Apply the theme before first paint (no white flash in night mode). Kept in sync by src/theme.js.
      try {
        var t = localStorage.getItem("armorix_theme");
        if (t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
      } catch (e) {}
